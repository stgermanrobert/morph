# Builds Morph for Windows: self-contained .exe (Python, Qt and FFmpeg bundled), installer and portable ZIP.
# Every build is tested on a clean runner (self-test, silent install, run, uninstall). Tags v* publish a Release.
# Generated by gen_packaging.py.
name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Translations complete (EN · ES · RU)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/i18n_check.py

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import re,pathlib;print(re.search(r'__version__ = .(.+?).$', pathlib.Path('src/morph.py').read_text(encoding='utf-8'), re.M).group(1))"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME does not match __version__ = $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          python packaging/make_version.py $v "Morph" "Audio and video converter"

      - name: FFmpeg (BtbN static GPL build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view latest -R BtbN/FFmpeg-Builds --json assets | ConvertFrom-Json
          $cands = foreach ($x in $rel.assets) {
            if ($x.name -match '^ffmpeg-n(\d+\.\d+)-latest-win64-gpl-\d+\.\d+\.zip$') { [pscustomobject]@{ name = $x.name; v = [version]$Matches[1] } }
          }
          $pick = ($cands | Sort-Object v -Descending | Select-Object -First 1).name
          if (-not $pick) { $pick = "ffmpeg-master-latest-win64-gpl.zip" }
          Write-Host "Using $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -D ffdl
          Expand-Archive "ffdl/$pick" -DestinationPath ffdl -Force
          New-Item -ItemType Directory -Force build_bin | Out-Null
          $exe = Get-ChildItem ffdl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName, (Join-Path $exe.DirectoryName "ffprobe.exe") build_bin/
          $lic = Get-ChildItem ffdl -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName build_bin/FFmpeg-LICENSE.txt }
          "Build: https://github.com/BtbN/FFmpeg-Builds/releases/tag/latest ($pick)" | Out-File build_bin/FFmpeg-SOURCE.txt -Encoding utf8
          & build_bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Deno (JavaScript runtime yt-dlp needs for YouTube)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R denoland/deno -p "deno-x86_64-pc-windows-msvc.zip" -D denodl
          Expand-Archive denodl/deno-x86_64-pc-windows-msvc.zip -DestinationPath denodl -Force
          Copy-Item denodl/deno.exe build_bin/
          & build_bin/deno.exe --version

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/morph.spec

      - name: Bundle binaries and licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Morph/_internal/bin | Out-Null
          Copy-Item build_bin/* dist/Morph/_internal/bin/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/Morph/

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Morph/Morph.exe" -ArgumentList "--selftest", "$pwd\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DMyVersion=${{ steps.ver.outputs.version }}" packaging/morph.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test the installer (install, run, uninstall)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = "out/Morph-Setup-$v.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Morph\Morph.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $p = Start-Process $exe -ArgumentList "--selftest", "$pwd\selftest_installed.txt" -Wait -PassThru
          Get-Content selftest_installed.txt
          if ($p.ExitCode -ne 0) { throw "The installed app failed its self-test" }
          $un = Join-Path $env:LOCALAPPDATA "Programs\Morph\unins000.exe"
          $p = Start-Process $un -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed" }

      - name: Portable ZIP and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/Morph -DestinationPath "out/Morph-$v-portable-win64.zip" -CompressionLevel Optimal
          $files = @(Get-ChildItem out -File)
          $sums = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          Set-Content -Path out/SHA256SUMS.txt -Value $sums -Encoding ascii
          Get-ChildItem out -File | Select-Object Name, @{n="MB"; e={ [math]::Round($_.Length / 1MB, 1) }} | Format-Table -AutoSize

      - uses: actions/upload-artifact@v5
        with:
          name: Morph-windows
          path: out/*

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python packaging/release_notes.py ${{ steps.ver.outputs.version }} notes.md

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Morph ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: out/*
